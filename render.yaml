services:
  - type: web
    name: landslidesafe
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      # Leave VITE_API_URL empty so the frontend uses same-origin /api
      # (single Web Service serves both dist/ and Express API).
      # Do NOT set it to http://localhost:5000.
